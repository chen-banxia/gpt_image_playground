<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img" aria-labelledby="title desc">
  <title id="title">New API 三组独立 Key 设置示意</title>
  <desc id="desc">同一个网关根地址，生图、豆包视频和海螺视频分别配置 Key。四个豆包模型自动使用豆包视频 Key，MiniMax H3 自动使用海螺视频 Key。</desc>
  <style>
    text {font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#e7e9ee;font-size:17px}
    .small {font-size:14px;fill:#aeb6c5}
    .label {font-size:16px;font-weight:600}
    .field {fill:#20242c;stroke:#39404d}
    .blue {fill:#a9caff}
  </style>
  <rect width="1100" height="800" fill="#0e1117"/>
  <rect x="42" y="28" width="1016" height="744" rx="18" fill="#181c23" stroke="#343a45"/>
  <text x="72" y="74" font-size="24" font-weight="700">接口设置</text>
  <text x="72" y="104" class="small">配置一次，前端根据所选模型自动使用对应的 Key</text>
  <text x="72" y="146" class="label">New API 网关根地址</text>
  <rect x="72" y="160" width="956" height="43" rx="8" class="field"/>
  <text x="88" y="188" class="small">https://newapi.example.com</text>
  <text x="72" y="226" class="small">填写实际部署地址，不包含 /v1 或视频任务路径</text>

  <text x="72" y="274" class="label">生图 API Key</text>
  <text x="72" y="301" class="small">现有图片工作台使用；保留原有图片模型配置</text>
  <rect x="72" y="314" width="742" height="43" rx="8" class="field"/>
  <text x="88" y="341">••••••••••••••••••••••••</text>
  <text x="759" y="341" class="small">显示</text>
  <rect x="840" y="326" width="18" height="18" rx="4" fill="#3478e8"/>
  <path d="m844 335 3 3 7-8" stroke="white" stroke-width="2" fill="none"/>
  <text x="870" y="341" class="small">记住生图 Key</text>

  <text x="72" y="403" class="label">豆包视频 API Key</text>
  <text x="72" y="430" class="small">Seedance 2.0 / 2.0 Fast / 2.0 Mini / 2.5 自动使用此 Key</text>
  <rect x="72" y="443" width="742" height="43" rx="8" class="field"/>
  <text x="88" y="470">••••••••••••••••••••••••</text>
  <text x="759" y="470" class="small">显示</text>
  <rect x="840" y="455" width="18" height="18" rx="4" fill="#3478e8"/>
  <path d="m844 464 3 3 7-8" stroke="white" stroke-width="2" fill="none"/>
  <text x="870" y="470" class="small">记住豆包 Key</text>

  <text x="72" y="532" class="label">海螺视频 API Key</text>
  <text x="72" y="559" class="small">MiniMax-H3 自动使用此 Key，通过海螺 H3 专用路由提交</text>
  <rect x="72" y="572" width="742" height="43" rx="8" class="field"/>
  <text x="88" y="599">••••••••••••••••••••••••</text>
  <text x="759" y="599" class="small">显示</text>
  <rect x="840" y="584" width="18" height="18" rx="4" fill="#3478e8"/>
  <path d="m844 593 3 3 7-8" stroke="white" stroke-width="2" fill="none"/>
  <text x="870" y="599" class="small">记住海螺 Key</text>

  <text x="72" y="662" class="small">可按需配置；缺少哪组 Key，仅影响对应模型，不会自动借用其他组 Key</text>
  <text x="72" y="689" class="small">记住的 Key 保存在当前浏览器，历史记录导出不包含 Key</text>
  <rect x="868" y="705" width="160" height="44" rx="9" fill="#3678e8"/>
  <text x="912" y="734" font-weight="600">保存设置</text>
</svg>
