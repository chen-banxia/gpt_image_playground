# 使用原始 request_uri 保留签名查询参数，仅允许指定 CDN 的视频产物。
map $request_uri $video_download_target {
    default "";
    ~*^/video-download-proxy/(?<video_download_host>ark-acg-cn-beijing\.tos-cn-beijing\.volces\.com|ark-content-generation-cn-beijing\.tos-cn-beijing\.volces\.com)(?<video_download_uri>/[^?]*\.(mp4|mov|webm)(\?.*)?)$ https://$video_download_host$video_download_uri;
}

server {
    listen ${HOST}:${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 600m;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # 静态资源长缓存（Vite 生成的带 hash 文件名）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # BEGIN API PROXY
    # API 代理。前端请求同源 /api-proxy/...，由 Nginx 转发到部署时配置的 API_PROXY_URL。
    location /api-proxy/ {
        limit_except POST OPTIONS {
            deny all;
        }

        set $allow_proxy 0;
        if ($uri ~* ^/api-proxy/((v1/)?(images/generations|images/edits|responses))$) {
            set $allow_proxy 1;
        }
        if ($allow_proxy = 0) {
            return 403 "Forbidden: API Proxy path restricted";
        }

        proxy_pass ${API_PROXY_URL}/;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 630s;
        proxy_read_timeout 630s;
        send_timeout 630s;
        proxy_socket_keepalive on;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
    }
    # END API PROXY

    # 仅放行 Doubao 与海螺任务路由；目标由部署环境固定，不开放任意代理。
    location /video-api-proxy/ {
        set $video_route "$request_method:$uri";
        if ($video_route !~ "^(POST:/video-api-proxy/(doubao/api/v3/contents/generations/tasks|hailuo/v[12]/video_generation)|GET:/video-api-proxy/(doubao/api/v3/contents/generations/tasks|hailuo/v[12]/query/video_generation)/[A-Za-z0-9_.~-]+)$") {
            return 403;
        }
        proxy_pass ${VIDEO_API_PROXY_URL}/;
        proxy_set_header Host $proxy_host;
        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        # 高于前端最长 600 秒提交等待，避免本站代理先在 60 秒中断。
        proxy_read_timeout 630s;
        proxy_send_timeout 630s;
        send_timeout 630s;
        proxy_buffering off;
        proxy_cache off;
    }

    # 产物文件代理：固定白名单、无鉴权头、无 Cookie、不跟随重定向。
    location /video-download-proxy/ {
        if ($request_method != GET) { return 405; }
        if ($video_download_target = "") { return 403; }
        resolver 127.0.0.11 valid=300s ipv6=off;
        proxy_pass $video_download_target;
        proxy_pass_request_headers off;
        proxy_set_header Host $video_download_host;
        proxy_set_header Range $http_range;
        proxy_ssl_server_name on;
        proxy_ssl_name $video_download_host;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_connect_timeout 15s;
        proxy_read_timeout 630s;
        send_timeout 630s;
        proxy_buffering off;
        proxy_cache off;
        access_log off;
        add_header X-Video-Download-Proxy "1" always;
        add_header Cache-Control "private, no-store" always;
        proxy_intercept_errors on;
        error_page 301 302 303 307 308 =502 @video_download_redirect_rejected;
    }
    location @video_download_redirect_rejected {
        add_header X-Video-Download-Proxy "1" always;
        return 502;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
